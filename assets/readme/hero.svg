<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Social Creator Workflow - End-to-End Content Operating System</title>
  <desc id="desc">Industrial multi-platform creator pipeline integrating intelligence, strategy, humanized drafting, and multimodal production.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="1020" cy="180" r="180" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="200" cy="350" r="140" fill="#10b981" opacity="0.06" filter="url(#glow)"/>

  <!-- Left: Brand & Copy Anchor -->
  <g transform="translate(64, 52)">
    <!-- Eyebrow Badge -->
    <rect width="250" height="28" rx="14" fill="#0f2937" stroke="#06b6d4" stroke-width="1"/>
    <text x="14" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">AGENT SKILLS · WORKFLOW OS</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Social Creator</text>
    <text x="0" y="130" fill="url(#cyanEmerald)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Workflow</text>

    <!-- Value Statement -->
    <text x="0" y="174" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="16" font-weight="400">自媒体全流程智能创作操作系统</text>
    <text x="0" y="198" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="14" font-weight="400">情报先行 · 商业对标 · 架构级去AI味 · 工业级物料装配</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 246)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="136" height="34" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">零付费 API 依赖</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(146, 0)">
        <rect width="144" height="34" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">Sepia 架构级洗稿</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(300, 0)">
        <rect width="148" height="34" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">原生 MCP 真实数据</text>
      </g>
    </g>

    <!-- Runtime compatibility tags -->
    <g transform="translate(0, 308)">
      <text x="0" y="14" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">COMPATIBLE WITH:</text>
      <text x="114" y="14" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Antigravity · Claude Code · Codex · Cursor · OpenCode</text>
    </g>
  </g>

  <!-- Right: Project Native Material (The 5-Stage Live Flight Path Card) -->
  <g transform="translate(680, 42)">
    <rect width="460" height="336" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>

    <!-- Card Header -->
    <g transform="translate(24, 28)">
      <circle cx="6" cy="6" r="4" fill="#10b981"/>
      <circle cx="22" cy="6" r="4" fill="#06b6d4"/>
      <circle cx="38" cy="6" r="4" fill="#64748b"/>
      <text x="64" y="10" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">PIPELINE EXECUTION MATRIX</text>
    </g>

    <!-- Flow Items -->
    <g transform="translate(24, 64)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect width="32" height="32" rx="6" fill="#0e7490" fill-opacity="0.3" stroke="#0891b2" stroke-width="1"/>
        <text x="11" y="21" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">01</text>
        <text x="44" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">全域情报雷达</text>
        <text x="44" y="28" fill="#64748b" font-family="monospace" font-size="11">cn-scraper MCP (XHS / Bili / Douyin / Zhihu)</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <rect width="32" height="32" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
        <text x="11" y="21" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">02</text>
        <text x="44" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">商业定位与对标过滤</text>
        <text x="44" y="28" fill="#64748b" font-family="monospace" font-size="11">dbskill (五重对标过滤 / 伪需求消解)</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <rect width="32" height="32" rx="6" fill="#047857" fill-opacity="0.3" stroke="#059669" stroke-width="1"/>
        <text x="11" y="21" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">03</text>
        <text x="44" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">深度起草与架构级洗AI味</text>
        <text x="44" y="28" fill="#64748b" font-family="monospace" font-size="11">khazix-writer + sepia (三层洗稿) + oil-tone</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <rect width="32" height="32" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#4f46e5" stroke-width="1"/>
        <text x="11" y="21" fill="#818cf8" font-family="monospace" font-size="13" font-weight="700">04</text>
        <text x="44" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">工业级物料装配与交付</text>
        <text x="44" y="28" fill="#64748b" font-family="monospace" font-size="11">gzh-design (排版) + oil-subtitle (视听核验)</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(0, 192)">
        <rect width="32" height="32" rx="6" fill="#b45309" fill-opacity="0.3" stroke="#d97706" stroke-width="1"/>
        <text x="11" y="21" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">05</text>
        <text x="44" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">资产复利与认知归档</text>
        <text x="44" y="28" fill="#64748b" font-family="monospace" font-size="11">dbs-save + 词库自学习 + 沉淀个人专有资产</text>
      </g>
    </g>

    <!-- Connector Line on Left of Steps -->
    <line x1="40" y1="104" x2="40" y2="280" stroke="#334155" stroke-dasharray="2 2" stroke-width="1.5"/>
  </g>
</svg>
